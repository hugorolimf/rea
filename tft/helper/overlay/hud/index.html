<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Sobre o jogo o overlay é sempre escuro: data-theme="dark" fixa os tokens de /v2/css/tokens.css (que agora têm tema claro). -->
<meta name="color-scheme" content="dark">
<title>TFT Compass · overlay</title>
<link rel="stylesheet" href="/v2/css/tokens.css">
<link rel="stylesheet" href="/v2/css/rich.css">
<link rel="stylesheet" href="hud.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4 3 20h18L12 4Zm0 6v5m0 3v.01"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4m0 1h11l-2.5 4L17 13H6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-bank" viewBox="0 0 24 24"><path d="M12 4v11m-4-4 4 4 4-4M5 20h14"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8"/></symbol>
    <symbol id="i-roll" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></symbol>
    <symbol id="i-items" viewBox="0 0 24 24"><path d="m12 3 7 7-7 11-7-11 7-7ZM5 10h14M9 10l3 11 3-11"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-wisp" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.5 1 2 2 2-.5-3 0-5 1-8Z"/></symbol>
  </defs>
</svg>

<div class="toolbar" id="toolbar" aria-label="Ferramentas do overlay"></div>

<!-- Modo painel: coluna de cartões. No modo integrado as seções (e o dock) vivem nos invólucros do palco. -->
<main class="ov" id="ov" data-status="loading" data-dim="0">
  <section class="card dock" id="dock" aria-label="Overlay: ajuda e saúde das fontes"></section>
  <section class="card bar" id="bar" aria-label="Estado da partida" hidden></section>
  <section class="card msg-card" id="message" role="status" hidden></section>
  <section class="card carousel" id="carousel" aria-live="polite" aria-label="Carrossel: o que pegar" hidden></section>
  <section class="card augments" id="augments" aria-live="polite" aria-label="Aprimoramentos: qual escolher" hidden></section>
  <section class="card hints" id="hints" aria-label="Dicas" hidden></section>
  <section class="card roll" id="roll" aria-live="polite" aria-label="Veredito de rolagem" hidden></section>
  <section class="card items" id="items" aria-label="Itens" hidden></section>
  <section class="card builds" id="builds" aria-label="Itens da formação" hidden></section>
  <section class="card plan" id="plan" aria-label="Plano" hidden></section>
  <section class="card keys" id="keys" aria-label="Atalhos do overlay e Copiar comp" hidden></section>
</main>

<!-- Modo integrado: o palco cobre a área cliente do jogo; os invólucros dos elementos são criados por hud.mjs. -->
<div class="stage" id="stage" hidden>
  <div class="layer layer-markers" id="markers" aria-hidden="true" hidden></div>
  <div class="layer layer-calib" id="calib" aria-hidden="true" hidden></div>
  <div class="cal-surface" id="cal-surface" title="Arraste para mover a grade; a roda do mouse muda a escala" hidden></div>
  <div class="fs-banner" id="fsbanner" role="alert" hidden></div>
  <div class="edit-banner" id="editbanner" role="status" hidden></div>
  <aside class="card help" id="help" aria-label="Ajuda do overlay" hidden></aside>
  <aside class="card cal-panel" id="cal-panel" aria-label="Controles da calibração" hidden></aside>
</div>

<div class="grip" id="grip" aria-hidden="true" title="Arraste para redimensionar"></div>

<script type="module" src="hud.mjs"></script>
</body>
</html>
